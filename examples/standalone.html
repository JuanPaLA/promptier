<!doctype html>
<meta charset="utf-8" />
<title>Promptier — standalone</title>

<!--
  The whole integration. One script tag, one element, a string in and a string
  out. No build step, no framework, no knowledge of the document model.

  Build it first:  yarn workspace core-editor build
-->
<script src="../core-editor/dist/promptier.js"></script>

<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 2rem; max-width: 60rem; }
  prompt-editor { display: block; min-height: 22rem; border: 1px solid #ccc; border-radius: 4px; padding: .75rem; }
  pre { background: #f5f5f5; padding: .75rem; border-radius: 4px; white-space: pre-wrap; }
  button { padding: .4rem .9rem; margin: .75rem 0; cursor: pointer; }
</style>

<h1>Standalone editor</h1>

<prompt-editor id="editor"></prompt-editor>

<button id="save">Save</button>
<pre id="saved">Press Save to read the prompt back.</pre>

<script>
  const editor = document.getElementById('editor');

  // A string goes in. This is the only shape a host ever deals with.
  editor.value = [
    'Eres un asistente de soporte.',
    '',
    '<objetivos>',
    'Resolver la consulta en el menor número de turnos.',
    '</objetivos>',
    '',
    '<reglas_de_estilo>',
    'Usa frases **cortas** y evita jerga.',
    '',
    '- Saluda con cortesía.',
    '- Propón una solución concreta.',
    '</reglas_de_estilo>',
  ].join('\n');

  // A string comes out — ready to store, and ready to send to a model.
  document.getElementById('save').onclick = () => {
    document.getElementById('saved').textContent = editor.value;
  };
</script>
